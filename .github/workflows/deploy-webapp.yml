name: 아이패드 웹앱 배포본 만들기

# 웹앱을 빌드해 두 곳에 놓는다.
#
# 1. GitHub Pages — 아이패드·휴대폰에서 주소만 치면 열린다.
# 2. Actions 산출물 zip — 사내 웹서버에 올리거나 오프라인으로 건넬 때.
#
# **Pages 사이트는 공개다.** 저장소가 비공개여도 그렇다. 브라우저가 파이썬을
# 실행하는 구조라 휠 안의 엔진 소스가 주소를 아는 사람에게 읽힌다. 명부 자료는
# 다르다 — 산출은 전부 기기 안에서 돌고 올린 명부는 그 브라우저에만 남으므로
# 서버로 가지 않는다. 코드는 보이고 자료는 보이지 않는다.
#
# 어느 쪽으로 나가든 이 워크플로가 **예제 명부 CSV 가 실리지 않았는지** 를
# 배포 전에 한 번 더 확인한다.
on:
  push:
    branches: ["claude/pension-actuarial-system-2txkoa"]
    paths:
      - "webapp/**"
      - "src/pension/**"
      - "docs/사용설명서.md"
      - "pyproject.toml"
      - ".github/workflows/deploy-webapp.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 뒤엣것이 앞엣것을 앞질러 옛 판을 올리면 안 된다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 웹앱 빌드
        id: build
        run: |
          python webapp/build.py
          stamp=$(python - <<'STAMP'
          import pathlib, re
          page = pathlib.Path("webapp/dist/index.html").read_text(encoding="utf-8")
          print(re.search(r'id="build-stamp">([a-f0-9]+)', page).group(1))
          STAMP
          )
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
          echo "빌드 $stamp"

      - name: 개인정보 미포함 확인
        run: |
          python - <<'CHECK'
          import glob, zipfile
          wheel = glob.glob("webapp/dist/wheels/pension_actuarial-*.whl")[0]
          csvs = [n for n in zipfile.ZipFile(wheel).namelist() if n.endswith(".csv")]
          assert not csvs, f"개인정보 CSV 가 웹앱에 실렸다: {csvs}"
          print("확인: 웹앱 휠에 명부 CSV 없음")
          CHECK

      # Pages 는 밑줄로 시작하는 파일·폴더를 감춘다. 파이오다이드 런타임에 그런
      # 이름이 있어, 이것이 없으면 엔진이 반쯤 빠진 채로 올라간다.
      - name: Jekyll 처리 끄기
        run: touch webapp/dist/.nojekyll

      - name: 배포본 업로드 (zip)
        uses: actions/upload-artifact@v4
        with:
          name: 웹앱-${{ steps.build.outputs.stamp }}
          path: webapp/dist
          retention-days: 30

      # 저장소 설정에서 Pages 원본을 손으로 바꿔 두지 않아도 되게 한다. 지금은
      # 'branch 에서 배포' 로 되어 있어 올릴 것이 없어 404 가 났다.
      - name: Pages 원본을 이 워크플로로
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Pages 산출물 만들기
        uses: actions/upload-pages-artifact@v3
        with:
          path: webapp/dist

  # 빌드와 나눈 것은 Pages 배포에만 강한 권한(id-token)이 필요하기 때문이다.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Pages 로 올리기
        id: pages
        uses: actions/deploy-pages@v4
