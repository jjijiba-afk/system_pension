name: 아이패드 웹앱 배포본 만들기

# 웹앱을 빌드해 zip 하나로 묶어 Actions 산출물로 올린다. 이것이 기본이고,
# **저장소 설정에서 Pages 를 켜 두면** 같은 결과물을 주소로도 올린다.
#
# Pages 는 워크플로가 스스로 켤 수 없다(토큰에 그 권한이 없다). 그래서 켜져
# 있는지 먼저 물어보고, 꺼져 있으면 주소 배포만 건너뛴다 — 빌드가 빨간색이
# 되지는 않는다. 켜는 순간부터는 손댈 것 없이 알아서 올라간다.
#
# **Pages 사이트는 공개다.** 저장소가 비공개여도 그렇다. 브라우저가 파이썬을
# 실행하는 구조라 휠 안의 엔진 소스가 주소를 아는 사람에게 읽힌다. 명부 자료는
# 다르다 — 산출은 전부 기기 안에서 돌고 올린 명부는 그 브라우저에만 남으므로
# 서버로 가지 않는다. 코드는 보이고 자료는 보이지 않는다.
#
# 어느 쪽으로 나가든 이 워크플로가 **예제 명부 CSV 가 실리지 않았는지** 를
# 배포 전에 한 번 더 확인한다.
on:
  push:
    branches: ["claude/pension-actuarial-system-2txkoa"]
    paths:
      - "webapp/**"
      - "src/pension/**"
      - "docs/사용설명서.md"
      - "pyproject.toml"
      - ".github/workflows/deploy-webapp.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 뒤엣것이 앞엣것을 앞질러 옛 판을 올리면 안 된다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.pages.outputs.on }}
      stamp: ${{ steps.build.outputs.stamp }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 맞춤 도메인은 Secret 으로 넘긴다. 저장소에 적어 두면 주소를 아는
      # 사람이 코드 검색으로 이 저장소를 찾을 수 있고, Secret 은 실행 기록에도
      # 가려져 나온다. 아직 안 만들었으면 webapp/CNAME 이 대신 쓰인다.
      - name: 맞춤 도메인이 어디서 오는지
        run: |
          if [ -n "${{ secrets.PAGES_DOMAIN }}" ]; then
            echo "도메인: Secret 에서 받습니다"
          elif [ -f webapp/CNAME ]; then
            echo "::warning::도메인이 아직 webapp/CNAME 에 있습니다. \
            Settings → Secrets and variables → Actions 에서 PAGES_DOMAIN \
            Secret 을 만든 뒤 이 파일을 지우세요."
          else
            echo "::warning::맞춤 도메인이 없습니다. github.io 주소로 올라갑니다."
          fi

      - name: 웹앱 빌드
        id: build
        env:
          PAGES_DOMAIN: ${{ secrets.PAGES_DOMAIN }}
        run: |
          python webapp/build.py
          stamp=$(python - <<'STAMP'
          import pathlib, re
          page = pathlib.Path("webapp/dist/index.html").read_text(encoding="utf-8")
          print(re.search(r'id="build-stamp">([a-f0-9]+)', page).group(1))
          STAMP
          )
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
          echo "빌드 $stamp"

      - name: 개인정보 미포함 확인
        run: |
          python - <<'CHECK'
          import glob, zipfile
          wheel = glob.glob("webapp/dist/wheels/pension_actuarial-*.whl")[0]
          csvs = [n for n in zipfile.ZipFile(wheel).namelist() if n.endswith(".csv")]
          assert not csvs, f"개인정보 CSV 가 웹앱에 실렸다: {csvs}"
          print("확인: 웹앱 휠에 명부 CSV 없음")
          CHECK

      # Pages 는 밑줄로 시작하는 파일·폴더를 감춘다. 파이오다이드 런타임에 그런
      # 이름이 있어, 이것이 없으면 엔진이 반쯤 빠진 채로 올라간다.
      - name: Jekyll 처리 끄기
        run: touch webapp/dist/.nojekyll

      - name: 배포본 업로드 (zip)
        uses: actions/upload-artifact@v4
        with:
          name: 웹앱-${{ steps.build.outputs.stamp }}
          path: webapp/dist
          retention-days: 30

      # 켜져 있는지 먼저 본다. 물어보지 않고 올리면, 꺼져 있는 저장소에서는
      # 마지막 단계가 죽어 빌드 전체가 빨간색이 된다.
      - name: Pages 가 켜져 있는지
        id: pages
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/pages")
          if [ "$code" = "200" ]; then
            echo "on=true" >> "$GITHUB_OUTPUT"
            echo "Pages 켜져 있음 — 주소로도 올립니다"
          else
            echo "on=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Pages 가 꺼져 있어 주소 배포를 건너뜁니다. \
            저장소 Settings → Pages → Source 를 'GitHub Actions' 로 바꾸고 \
            다시 푸시하면 그때부터 자동으로 올라갑니다. zip 은 그대로 나왔습니다."
          fi

      - name: Pages 산출물 만들기
        if: steps.pages.outputs.on == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: webapp/dist

  # 빌드와 나눈 것은 Pages 배포에만 강한 권한(id-token)이 필요하기 때문이다.
  deploy:
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Pages 로 올리기
        id: pages
        uses: actions/deploy-pages@v4
