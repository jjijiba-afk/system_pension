name: 아이패드 웹앱 배포본 만들기

# 웹앱을 빌드해 zip 하나로 묶어 Actions 산출물로 올린다.
#
# GitHub Pages 로 직접 배포하지 않는다. Pages 주소는 계정명에서 만들어지고
# 사이트가 공개라 휠 안의 파이썬 소스가 그대로 읽힌다. 대신 여기서 만든 zip 을
# 접근 제어가 걸린 정적 호스팅(Cloudflare Pages + Access 등)이나 사내 웹서버에
# 올린다 — 허용한 사람만 열 수 있고 코드도 함께 가려진다.
#
# 어느 쪽으로 올리든 이 워크플로가 **예제 명부 CSV 가 실리지 않았는지** 를
# 배포 전에 한 번 더 확인한다.
on:
  push:
    branches: ["claude/pension-actuarial-system-2txkoa"]
    paths:
      - "webapp/**"
      - "src/pension/**"
      - "pyproject.toml"
      - ".github/workflows/deploy-webapp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 웹앱 빌드
        id: build
        run: |
          python webapp/build.py
          stamp=$(python - <<'STAMP'
          import pathlib, re
          page = pathlib.Path("webapp/dist/index.html").read_text(encoding="utf-8")
          print(re.search(r'id="build-stamp">([a-f0-9]+)', page).group(1))
          STAMP
          )
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"
          echo "빌드 $stamp"

      - name: 개인정보 미포함 확인
        run: |
          python - <<'CHECK'
          import glob, zipfile
          wheel = glob.glob("webapp/dist/wheels/pension_actuarial-*.whl")[0]
          csvs = [n for n in zipfile.ZipFile(wheel).namelist() if n.endswith(".csv")]
          assert not csvs, f"개인정보 CSV 가 웹앱에 실렸다: {csvs}"
          print("확인: 웹앱 휠에 명부 CSV 없음")
          CHECK

      - name: 배포본 업로드
        uses: actions/upload-artifact@v4
        with:
          name: 웹앱-${{ steps.build.outputs.stamp }}
          path: webapp/dist
          retention-days: 30
