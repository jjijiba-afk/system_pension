name: Windows 실행파일 빌드

# 윈도우 러너에서 EXE 를 만들어 아티팩트로 올린다. 개발환경 없이도
# Actions 탭에서 내려받아 바로 쓸 수 있다.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: 테스트 (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # 본 화면 시험은 tkinter 와 화면이 있어야 돈다. 둘 중 하나라도 없으면
      # 조용히 건너뛰는데, 그러면 PC 화면 전체가 시험되지 않은 채로 지나간다.
      # 그래서 가상 화면을 붙이고, tkinter 가 없으면 여기서 멈추게 한다.
      - name: 가상 화면
        run: sudo apt-get install -y --no-install-recommends xvfb
      - name: tkinter 확인
        run: python -c "import tkinter; print(tkinter.TkVersion)"
      - name: pytest
        run: xvfb-run -a python -m pytest -q

  # 브라우저 화면은 따로 돈다. 실제 크로미움과 빌드된 dist 가 있어야 하는데,
  # 위 잡에는 둘 다 없어 27개가 통째로 조용히 건너뛰고 있었다 — 지금 주력이
  # 웹앱인데 그쪽만 한 번도 시험되지 않은 채로 지나간 셈이다.
  webapp:
    name: 웹앱 (브라우저)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install playwright
      - name: Chromium
        run: python -m playwright install --with-deps chromium
      # 화면은 dist 를 보고 돈다. 먼저 만들지 않으면 옛 판을 시험하거나
      # 아예 건너뛴다.
      - name: 웹앱 빌드
        run: python webapp/build.py
      - name: pytest (webapp)
        run: python -m pytest tests/test_webapp_e2e.py -q

  build:
    name: EXE 빌드 (Windows)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build,dev]"

      - name: 테스트 (Windows)
        run: python -m pytest -q

      # 웹앱이 실행 파일 **안** 으로 들어가므로 PyInstaller 보다 먼저 있어야 한다.
      - name: 웹앱 빌드
        run: python webapp/build.py

      - name: 실행파일 빌드
        run: python -m PyInstaller pension.spec --noconfirm --clean

      - name: 배포 꾸러미 구성
        shell: pwsh
        run: |
          $pack = "dist/연금계리산출"
          New-Item -ItemType Directory -Force -Path "$pack/기본자료" | Out-Null
          New-Item -ItemType Directory -Force -Path "$pack/설명서" | Out-Null
          Move-Item dist/연금계리산출.exe "$pack/"
          Move-Item dist/pension-cli.exe "$pack/"
          # 담당자용 문서만 넣는다. 개발 메모(vba-mapping)는 종전 규칙의
          # 파일명과 구조가 적힌 것이라 배포물에 실을 것이 아니다.
          Copy-Item docs/사용설명서.md, docs/계리방법론.md, `
                    docs/지급률규정-작성법.md "$pack/설명서/"

          # 방금 만든 EXE 로 기본 파일을 뽑는다. 빌드된 실행 파일이 실제로
          # 도는지까지 한 번에 확인된다.
          & "$pack/pension-cli.exe" --version

          # [전체 기능 화면] 은 이제 EXE 안에 들어 있다. 실행해서 실제로
          # 찾아지는지 확인한다 — 묶이지 않았으면 여기서 걸린다.
          & "$pack/pension-cli.exe" app --no-browser --check
          & "$pack/pension-cli.exe" samples "$pack/기본자료"

          # 기본 파일만으로 산출이 끝까지 도는지 확인한다. 기본 명부는 난수로
          # 만든 것이라 검증 오류가 없어야 하므로 --force 없이 돌린다.
          & "$pack/pension-cli.exe" calc `
              "$pack/기본자료/명부_기본.xlsx" `
              "$pack/기본자료/기초율_기본값.xlsx" `
              -o "$env:RUNNER_TEMP/연습산출.xlsx"

          Compress-Archive -Path "$pack/*" -DestinationPath dist/연금계리산출.zip -Force
          Get-ChildItem -Recurse $pack | Select-Object FullName, Length

      # 프로그램을 남에게 건네면 같이 들어 있는 자료도 건네진다. 웹앱 쪽은
      # 원래 걸러 내고 있었는데 윈도우 꾸러미에는 그 방어가 없어, 실제 명부가
      # 그대로 실려 나간 적이 있다. 이제 양쪽 다 여기서 막는다.
      #
      # 검사 자체는 tools/check_release.py 에 있다. 이 잡은 PowerShell 로 도는데
      # 거기에는 bash 의 heredoc 이 없어, 파이썬 코드를 인라인으로 끼워 넣으면
      # `<<` 가 리디렉션으로 해석되어 죽는다.
      - name: 개인정보 미포함 확인
        shell: pwsh
        run: python tools/check_release.py "dist/연금계리산출"

      # 설치 프로그램. zip 을 풀어 쓰는 것보다 나은 점이 분명하다 — 시작 메뉴
      # 아이콘이 생기고, 제어판에서 지워지고, 무엇보다 **실행 파일만 꺼내
      # 복사하다 자료를 잃는 사고** 가 없다.
      - name: 설치 프로그램 만들기
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc /DSourceDir="$PWD\dist\연금계리산출" /DOutputDir="$PWD\dist" `
                  packaging\설치.iss
          if (-not (Test-Path "dist/연금계리산출_설치.exe")) {
            throw "설치 프로그램이 만들어지지 않았습니다"
          }
          Get-Item dist/연금계리산출_설치.exe | Select-Object Name, Length

      - name: 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: 연금계리산출-windows
          path: |
            dist/연금계리산출_설치.exe
            dist/연금계리산출.zip
          retention-days: 90

      - name: 릴리스에 첨부 (태그 푸시 시)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/연금계리산출_설치.exe
            dist/연금계리산출.zip

      # 개발 branch 에서는 롤링 프리릴리스를 만들지 않는다. GitHub 가 릴리스
      # 자산을 불변으로 두면서 같은 자리를 덮어쓰지 못하게 됐고("Cannot delete
      # asset from an immutable release"), 그 한 스텝 때문에 나머지가 다 통과한
      # 회차도 빨간불이 됐다. 배포는 웹앱(Pages)으로 하고, 실행파일이 필요하면
      # 위의 아티팩트나 태그(v*) 로 낸 정식 릴리스를 쓴다.
