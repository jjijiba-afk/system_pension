name: Windows 실행파일 빌드

# 윈도우 러너에서 EXE 를 만들어 아티팩트로 올린다. 개발환경 없이도
# Actions 탭에서 내려받아 바로 쓸 수 있다.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: 테스트 (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      # PC 편집기(tkinter) 시험은 화면이 있어야 돈다. 없으면 조용히 건너뛰므로
      # 가상 화면을 붙여 리눅스에서도 실제로 창을 띄워 확인한다.
      - name: 가상 화면
        run: sudo apt-get install -y --no-install-recommends xvfb
      - name: pytest
        run: xvfb-run -a python -m pytest -q

  build:
    name: EXE 빌드 (Windows)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build,dev]"

      - name: 테스트 (Windows)
        run: python -m pytest -q

      - name: 실행파일 빌드
        run: python -m PyInstaller pension.spec --noconfirm --clean

      - name: 아이패드 웹앱 빌드
        run: python webapp/build.py

      - name: 배포 꾸러미 구성
        shell: pwsh
        run: |
          $pack = "dist/연금계리산출"
          New-Item -ItemType Directory -Force -Path "$pack/기본자료" | Out-Null
          New-Item -ItemType Directory -Force -Path "$pack/설명서" | Out-Null
          Copy-Item -Recurse webapp/dist "$pack/아이패드웹앱"

          Move-Item dist/연금계리산출.exe "$pack/"
          Move-Item dist/pension-cli.exe "$pack/"
          # 담당자용 문서만 넣는다. 개발 메모(vba-mapping)는 원본 매크로의
          # 파일명과 구조가 적힌 것이라 배포물에 실을 것이 아니다.
          Copy-Item docs/사용설명서.md, docs/계리방법론.md, `
                    docs/지급률규정-작성법.md "$pack/설명서/"

          # 방금 만든 EXE 로 기본 파일을 뽑는다. 빌드된 실행 파일이 실제로
          # 도는지까지 한 번에 확인된다.
          & "$pack/pension-cli.exe" --version

          # [전체 기능 화면] 은 EXE 옆의 '아이패드웹앱' 폴더를 찾는다. 꾸러미
          # 배치가 어긋나면 사용자가 버튼을 눌러야 알게 되므로 여기서 확인한다.
          if (-not (Test-Path "$pack/아이패드웹앱/index.html")) {
            throw "전체 기능 화면 폴더가 빠졌습니다"
          }
          & "$pack/pension-cli.exe" samples "$pack/기본자료"

          # 기본 파일만으로 산출이 끝까지 도는지 확인한다. 기본 명부는 난수로
          # 만든 것이라 검증 오류가 없어야 하므로 --force 없이 돌린다.
          & "$pack/pension-cli.exe" calc `
              "$pack/기본자료/명부_기본.xlsx" `
              "$pack/기본자료/기초율_기본값.xlsx" `
              -o "$env:RUNNER_TEMP/연습산출.xlsx"

          Compress-Archive -Path "$pack/*" -DestinationPath dist/연금계리산출.zip -Force
          Get-ChildItem -Recurse $pack | Select-Object FullName, Length

      # 프로그램을 남에게 건네면 같이 들어 있는 자료도 건네진다. 웹앱 쪽은
      # 원래 걸러 내고 있었는데 윈도우 꾸러미에는 그 방어가 없어, 실제 명부가
      # 그대로 실려 나간 적이 있다. 이제 양쪽 다 여기서 막는다.
      - name: 개인정보 미포함 확인
        shell: pwsh
        run: |
          $pack = "dist/연금계리산출"
          $csv = Get-ChildItem -Recurse -Filter *.csv $pack
          if ($csv) { throw "꾸러미에 CSV 가 실렸다: $($csv.FullName -join ', ')" }

          # 난수 명부는 씨앗에서 만들어 낸다. 원자료가 실행 파일 안에 있으면
          # 실제 명부를 되살릴 수 있다는 뜻이다.
          python - <<'CHECK'
          import pathlib, sys
          for exe in pathlib.Path("dist/연금계리산출").glob("*.exe"):
              blob = exe.read_bytes()
              for mark in (b"\xea\xb8\xb0\xeb\xb3\xb8\xeb\xaa\x85\xeb\xb6\x80_",):
                  if mark in blob:
                      sys.exit(f"{exe.name} 안에 기본명부 원자료가 남아 있다")
          print("확인: 실행 파일에 명부 원자료 없음")
          CHECK

      - name: 아티팩트 업로드
        uses: actions/upload-artifact@v4
        with:
          name: 연금계리산출-windows
          path: dist/연금계리산출.zip
          retention-days: 90

      - name: 릴리스에 첨부 (태그 푸시 시)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/연금계리산출.zip
