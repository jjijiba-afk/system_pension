[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pension-actuarial"
version = "1.0.0"
description = "K-IFRS 1019 확정급여채무 산출 시스템 (엑셀 종전 규칙 명부 규칙 이식 + PUC 계리 엔진)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
build = ["pyinstaller>=6.3"]

[project.scripts]
pension = "pension.cli:main"

[project.gui-scripts]
pension-gui = "pension.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP", "SIM", "RUF"]
ignore = [
    "E501",    # 줄 길이는 formatter 에 맡긴다
    "C408",    # kw = dict(...) 는 그대로 **kw 로 넘기는 용도라 의도한 표기다
    "RUF001",  # 한글 문서화 문자열의 전각 문장부호를 허용
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B008"]
